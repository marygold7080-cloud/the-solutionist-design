<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" fill="none" className="w-auto h-full">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEE21" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Hex Shield Glow -->
    <path d="M37 2 L67 19 L67 55 L37 72 L7 55 L7 19 Z" fill="#0c0d12" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M37 6 L63 21 L63 53 L37 68 L11 53 L11 21 Z" fill="url(#glowGrad)" opacity="0.15" />
    
    <!-- Stylized Futuristic 'S' Monogram in Shield -->
    <path d="M47 24 C47 24 38 18 27 23 C18 27 18 35 28 38 C38 41 49 43 47 52 C45 61 32 64 23 58" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="47" cy="24" r="3" fill="#FFE885" />
    <circle cx="23" cy="58" r="3" fill="#D4AF37" />
  </g>

  <!-- Typography: THE SOLUTIONIST -->
  <g transform="translate(98, 20)">
    <text x="0" y="30" font-family="'Sora', 'Montserrat', 'Inter', sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      THE SOLUTIONIST
    </text>
    <text x="2" y="47" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="7" fill="url(#goldGrad)">
      DESIGN AGENCY
    </text>
  </g>
</svg>
